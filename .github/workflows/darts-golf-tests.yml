name: Darts Golf tests

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/darts-golf*.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/darts-golf*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test "game/test/*.test.mjs"
